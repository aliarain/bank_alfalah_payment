name: bank_alfalah_payment
description: "A secure Flutter client SDK for Bank Alfalah payments. Backend-driven checkout sessions, strict redirect validation, and server-side payment verification — no merchant credentials in the app."
version: 0.1.0-beta.1
homepage: https://github.com/aliarain/bank_alfalah_payment
repository: https://github.com/aliarain/bank_alfalah_payment
issue_tracker: https://github.com/aliarain/bank_alfalah_payment/issues

environment:
  sdk: ^3.6.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  webview_flutter: ^4.10.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter_platform_interface: ^2.10.0

topics:
  - payments
  - payment-gateway
  - webview
