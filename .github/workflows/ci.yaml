name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Latest stable and previous stable.
        flutter-version: ["3.35.x", "3.32.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.flutter-version }}
          path: coverage/lcov.info

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Surface any files the Flutter tool rewrites during pub get, so a
      # dirty-tree publish warning is diagnosable straight from the log.
      - run: git status --short && git diff
      - run: dart pub publish --dry-run
